<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claire Pittman</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/0fab7b09a4.js" crossorigin="anonymous"></script>
</head>
<body>
    <section id="about-me">
       <nav>
        <div class="personal__logo">Claire Pittman</div>
         <ul class="nav__link--list">
            <li>
                <a href="" class="
                nav__link--anchor
                link__hover-effect
                link__hover-effect--black
                ">Languages</a>
            </li>
            <li>
                <a href="" class="
                nav__link--anchor
                link__hover-effect
                link__hover-effect--black
                ">Project</a>
            </li>
            <li>
                <a href="" class="
                nav__link--anchor
                nav__link--anchor-primary
                ">Contact</a>
            </li>
         </ul>
       </nav> 
        <div class="flex flex-1">
         <div class="about-me__info row">
            <div class="about-me__info--container">
                <figure class="about-me__picture--mask">
                    <img src="./assets/images.png" class="about-me__picture" alt="profile picture" class="about-me__info--image">
                </figure>
                <h1 class="about-me__info--title">
                    Hi, I'm <span class="text--purple">Claire Pittman</span>
                </h1>
                <p class="about-me__info--para">I'm a <strong class="text--purple">frontend software developer </strong>with experience in creating responsive and user-friendly websites.</p>
                <div class="about-me__links">
                    <a href="https://github.com" class="about-me__link" target="_blank">
                        <i class="fab fa-github"></i>
                    </a>
                    <a href="https://linkedin.com" class="about-me__link" target="_blank">
                        <i class="fab fa-linkedin"></i>
                    </a>
                </div>
            </div>
            <figure class="about-me__img--container">
                <img src="./assets/undraw_multitasking_i2bv.svg" class="about-me__img"  alt="profile picture">
            </figure>
        </div>
       </div>
    </section>
    <section id="languages">
     <div class="container">
        <div class="row">
            <h1 class="section__title">I am familiar with the following languages:</h1>
            <div class="language__list">
                <div class="language">
                    <figure class="language__img--wrapper">
                        <img src="" alt="" class="language__img">
                    </figure>
                </div>
            </div>
        </div>
     </div>
    </section>
</body>
</html>
